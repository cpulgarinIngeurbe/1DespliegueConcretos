<div id="seguimiento" class="tab-content">
    <div class="filter-section sg-bar" style="display: flex; align-items: flex-start; flex-wrap: wrap; gap: 8px; position: relative;">
        <div style="display: inline-block; position: relative;">
            <button class="filter-btn" id="sgBtnProyectos" type="button">Filtrar por Proyecto</button>
            <div class="sg-dd" id="sgDropdown"></div>
        </div>
        <button class="filter-btn" id="sgBtnConsolidar" type="button" title="Une los proyectos seleccionados en una sola curva">Consolidar en una curva</button>
        <button class="filter-btn reset-btn" id="sgBtnReset" type="button" style="align-self: center; margin-right: auto;">Restablecer Filtros</button>
        <div class="sg-tags" id="sgTags"></div>
    </div>
    <div class="sg-card">
        <div class="sg-card-head">
            <span class="sg-card-title">Seguimiento de resistencia · promedio de RESULTADO (%) por f'c y edad</span>
            <span class="sg-chip" id="sgResumen"></span>
        </div>
        <div id="sgChart"></div>
        <p class="sg-note">Cada punto es el promedio de RESULTADO (%) de las muestras con ese f'c (agrupado en 21, 28, 34, 41 y 48 MPa) y esa edad. Pasa el cursor sobre una curva o un punto para resaltarla y ver el detalle.</p>
    </div>
</div>
