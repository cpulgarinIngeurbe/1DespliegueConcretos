name: Enviar Reporte

on:
  workflow_dispatch:

jobs:
  enviar-reportes-por-proyecto:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests openpyxl pandas

      - name: Enviar reportes por proyecto
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          EMAIL_FLORA: ${{ secrets.EMAIL_FLORA }}
          EMAIL_TERRA: ${{ secrets.EMAIL_TERRA }}
          EMAIL_NATIVA: ${{ secrets.EMAIL_NATIVA }}
          EMAIL_VIALE: ${{ secrets.EMAIL_VIALE }}
          EMAIL_ALBURA: ${{ secrets.EMAIL_ALBURA }}
        run: |
          import requests
          import base64
          import os
          import tempfile
          import pandas as pd
          import re
          import json
          from datetime import datetime, timedelta
          from urllib.request import urlopen

          def extraer_unidad_estructural(localizacion):
              if pd.isna(localizacion):
                  return ''
              localizacion = str(localizacion).strip()
              if re.search(r'(?<![A-Za-z])(?:TORRE|T)\s*(\d+)', localizacion, re.IGNORECASE):
                  match = re.search(r'(?<![A-Za-z])(?:TORRE|T)\s*(\d+)', localizacion, re.IGNORECASE)
                  return f"Torre {int(match.group(1)):02d}"
              if re.search(r'ESCALERA', localizacion, re.IGNORECASE):
                  return 'Escalera'
              if re.search(r'SEMISOTANO', localizacion, re.IGNORECASE):
                  return 'Sótano'
              if re.search(r'PILOTE|PILOTAJE', localizacion, re.IGNORECASE):
                  return 'Pilotaje'
              if re.search(r'PLATAFORMA', localizacion, re.IGNORECASE):
                  return 'Plataforma'
              if re.search(r'BARRETE', localizacion, re.IGNORECASE):
                  return 'Barrete'
              if re.search(r'COMUNAL', localizacion, re.IGNORECASE):
                  return 'Salon Comunal'
              if re.search(r'RAMP[AS]', localizacion, re.IGNORECASE):
                  return 'Rampa'
              return ''

          def evaluar_cumplimiento(row):
              cumple_promedio = True
              cumple_minima = True
              if pd.notna(row.get('Promedio Móvil (MPa)')) and pd.notna(row.get('Resistencia nominal (MPa)')):
                  cumple_promedio = float(row.get('Promedio Móvil (MPa)', 0)) >= float(row.get('Resistencia nominal (MPa)', 0))
              if pd.notna(row.get('Resistencia Mínima (MPa)')) and pd.notna(row.get('Resistencia Promedio (MPa)')):
                  cumple_minima = float(row.get('Resistencia Mínima (MPa)', 0)) <= float(row.get('Resistencia Promedio (MPa)', 0))
              return 'Aprobado' if (cumple_promedio and cumple_minima) else 'Rechazado'

          def formatear_fecha(fecha_obj):
              if pd.isna(fecha_obj):
                  return ''
              try:
                  if isinstance(fecha_obj, str):
                      fecha_obj = pd.to_datetime(fecha_obj)
                  return fecha_obj.strftime('%d/%m/%Y')
              except:
                  return ''

          def generar_id_registro(row):
              cilindro = str(row.get('Cilindro N°', '')).strip()
              proyecto = str(row.get('Proyecto', '')).strip()
              edad = str(row.get('Edad (días)', '')).strip()
              rotura = str(row.get('Rotura', '')).strip()
              return f"{proyecto}|{cilindro}|{edad}|{rotura}"

          def cargar_control_enviados():
              archivo_control = '.github/data/enviados.csv'
              ids_enviados = set()
              if os.path.exists(archivo_control):
                  try:
                      with open(archivo_control, 'r') as f:
                          for linea in f:
                              linea = linea.strip()
                              if linea:
                                  ids_enviados.add(linea)
                      print(f'  [+] Cargados {len(ids_enviados)} registros del historial')
                  except Exception as e:
                      print(f'  [!] Error al leer archivo de control: {e}')
              else:
                  print(f'  [*] Archivo de control no existe (primera ejecución)')
              return ids_enviados

          def guardar_control_enviados(ids_nuevos):
              archivo_control = '.github/data/enviados.csv'
              try:
                  os.makedirs(os.path.dirname(archivo_control), exist_ok=True)
                  ids_existentes = cargar_control_enviados()
                  todos_los_ids = ids_existentes.union(ids_nuevos)
                  with open(archivo_control, 'w') as f:
                      for id_reg in sorted(todos_los_ids):
                          f.write(id_reg + '\n')
                  print(f'  [+] Control actualizado: {len(todos_los_ids)} registros guardados')
              except Exception as e:
                  print(f'  [!] Error al guardar control: {e}')

          logo_url = "https://raw.githubusercontent.com/cpulgarinIngeurbe/1DespliegueConcretos/main/Visuales/inge.png"

          tenant_id = os.getenv('TENANT_ID')
          client_id = os.getenv('CLIENT_ID')
          client_secret = os.getenv('CLIENT_SECRET')
          mail_from = os.getenv('MAIL_FROM')
          archivo_incumplimientos = "desplegable/Incumplimientos.xlsx"

          proyectos_correos = {
              'FLORA': os.getenv('EMAIL_FLORA'),
              'TERRA': os.getenv('EMAIL_TERRA'),
              'NATIVA': os.getenv('EMAIL_NATIVA'),
              'VIALE': os.getenv('EMAIL_VIALE'),
              'ALBURA': os.getenv('EMAIL_ALBURA')
          }

          print(f'\n[*] Iniciando envio de reportes por proyecto...')
          print(f'  [+] Correo remitente: {mail_from}')

          try:
              ids_ya_enviados_global = cargar_control_enviados()

              print(f'\n[*] Obteniendo token de acceso...')
              token_url = f'https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/token'
              token_data = {
                  'grant_type': 'client_credentials',
                  'client_id': client_id,
                  'client_secret': client_secret,
                  'scope': 'https://graph.microsoft.com/.default'
              }

              token_response = requests.post(token_url, data=token_data)
              if token_response.status_code != 200:
                  print(f'  [!] Error al obtener token: {token_response.text}')
                  exit(1)

              access_token = token_response.json()['access_token']
              print(f'  [+] Token obtenido exitosamente')

              print(f'\n[*] Leyendo archivo Incumplimientos.xlsx...')
              if not os.path.exists(archivo_incumplimientos):
                  print(f'  [!] Error: Archivo no encontrado: {archivo_incumplimientos}')
                  exit(1)

              df = pd.read_excel(archivo_incumplimientos)
              print(f'  [+] Archivo leido: {len(df)} registros totales')

              df['UNIDAD ESTRUCTURAL'] = df['Localización'].apply(extraer_unidad_estructural)
              df['Cumplimiento normativo'] = df.apply(evaluar_cumplimiento, axis=1)
              df['_ID_REGISTRO'] = df.apply(generar_id_registro, axis=1)

              proyectos_unicos = df['Proyecto'].unique()
              print(f'  [+] Proyectos encontrados: {list(proyectos_unicos)}')

              fecha_actual = (datetime.now() - timedelta(hours=5)).strftime('%d-%m-%Y %H:%M:%S')

              for proyecto in proyectos_unicos:
                  if pd.isna(proyecto):
                      continue

                  email_destino = proyectos_correos.get(proyecto)
                  if not email_destino:
                      print(f'\n[!] Advertencia: No hay correo configurado para proyecto: {proyecto}')
                      continue

                  print(f'\n[*] Procesando proyecto: {proyecto}')

                  df_proyecto = df[df['Proyecto'] == proyecto].copy()
                  registros_totales = len(df_proyecto)
                  print(f'  [+] Registros totales encontrados: {registros_totales}')

                  df_nuevos = df_proyecto[~df_proyecto['_ID_REGISTRO'].isin(ids_ya_enviados_global)].copy()
                  registros_nuevos = len(df_nuevos)
                  print(f'  [+] Registros nuevos (no enviados): {registros_nuevos}')

                  if registros_nuevos == 0:
                      print(f'  [*] No hay registros nuevos para {proyecto}, saltando envío')
                      continue

                  ids_a_enviar = set(df_nuevos['_ID_REGISTRO'].tolist())

                  df_nuevos_sin_id = df_nuevos.drop(columns=['_ID_REGISTRO'])

                  with tempfile.NamedTemporaryFile(suffix='.xlsx', delete=False) as tmp:
                      tmp_path = tmp.name
                      df_nuevos_sin_id.to_excel(tmp_path, index=False)

                  with open(tmp_path, 'rb') as f:
                      archivo_contenido = base64.b64encode(f.read()).decode()

                  columnas_tabla = ['ID', 'Proyecto', 'UNIDAD ESTRUCTURAL', 'Localización', 'Cilindro N°', 'Edad (días)', 'Toma', 'Rotura', 'Resistencia nominal (MPa)', 'Resistencia Teórica (MPa)', 'Resistencia Promedio (MPa)', 'Promedio Móvil (MPa)', 'Resistencia Mínima (MPa)', 'Cumplimiento normativo']

                  encabezados_html = "".join(
                      f'<th style="padding:5px 4px;text-align:left;font-size:9px;font-weight:700;color:#ffffff;background:#58595B;white-space:nowrap;">{col}</th>'
                      for col in columnas_tabla
                  )

                  filas_html = ""
                  for i, (_, row) in enumerate(df_nuevos.iterrows(), 1):
                      bg = "#f9fafb" if i % 2 == 1 else "#ffffff"
                      celdas = f'<td style="padding:4px 3px;border-bottom:1px solid #e5e7eb;font-size:9px;color:#374151;font-weight:600;color:#7CB342;">{i}</td>'

                      for col in columnas_tabla[1:]:
                          val = row.get(col, '')
                          if pd.isna(val):
                              val = '-'
                          elif col in ['Toma', 'Rotura'] and val != '-':
                              val = formatear_fecha(val)
                          elif isinstance(val, float) and col in ['Resistencia nominal (MPa)', 'Resistencia Teórica (MPa)', 'Resistencia Promedio (MPa)', 'Promedio Móvil (MPa)', 'Resistencia Mínima (MPa)']:
                              val = f"{val:.2f}"

                          celdas += f'<td style="padding:4px 3px;border-bottom:1px solid #e5e7eb;font-size:9px;color:#374151;">{val}</td>'

                      filas_html += f'<tr style="background:{bg};">{celdas}</tr>'

                  res_pct_col = df_nuevos.get('Resistencia (%)', pd.Series(dtype=float))
                  criticos = int((res_pct_col < 85).sum()) if len(res_pct_col) > 0 else 0
                  observacion = int(((res_pct_col >= 85) & (res_pct_col < 95)).sum()) if len(res_pct_col) > 0 else 0

                  logo_tag = f'<img src="{logo_url}" alt="INGEURBE" style="height:50px;" />'

                  html_partes = [
                      '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"></head>',
                      '<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,sans-serif;">',
                      '<table width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:30px 0;"><tr><td align="center">',
                      '<table width="95%" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);max-width:1200px;">',
                      '<tr><td style="background:#ffffff;padding:28px 36px;border-bottom:3px solid #8DC63F;">',
                      '<table width="100%" cellpadding="0" cellspacing="0"><tr>',
                      f'<td>{logo_tag}</td>',
                      f'<td align="right" style="color:#58595B;font-size:12px;font-weight:600;">{fecha_actual}</td>',
                      '</tr></table></td></tr>',
                      '<tr><td style="background:#8DC63F;height:5px;"></td></tr>',
                      '<tr><td style="padding:16px 24px 12px;">',
                      '<h1 style="margin:0;font-size:16px;color:#58595B;font-weight:700;">Reporte de Incumplimientos</h1>',
                      f'<p style="margin:4px 0 0;font-size:12px;color:#6b7280;">Proyecto: <strong style="color:#8DC63F;">{proyecto}</strong></p>',
                      '</td></tr>',
                      '<tr><td style="padding:0 24px 16px;"><table width="100%" cellpadding="0" cellspacing="0"><tr>',
                      '<td width="32%" style="padding:0 3px 0 0;"><table width="100%" cellpadding="0" cellspacing="0" style="background:#f9fafb;border-radius:6px;border-left:3px solid #8DC63F;"><tr><td style="padding:10px 12px;">',
                      '<div style="font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:0.3px;">Total Nuevos</div>',
                      f'<div style="font-size:20px;font-weight:700;color:#58595B;margin-top:2px;">{registros_nuevos}</div>',
                      '</td></tr></table></td>',
                      '<td width="32%" style="padding:0 3px;"><table width="100%" cellpadding="0" cellspacing="0" style="background:#f9fafb;border-radius:6px;border-left:3px solid #e67e22;"><tr><td style="padding:10px 12px;">',
                      '<div style="font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:0.3px;">Observacion</div>',
                      f'<div style="font-size:20px;font-weight:700;color:#e67e22;margin-top:2px;">{observacion}</div>',
                      '</td></tr></table></td>',
                      '<td width="32%" style="padding:0 0 0 3px;"><table width="100%" cellpadding="0" cellspacing="0" style="background:#f9fafb;border-radius:6px;border-left:3px solid #c0392b;"><tr><td style="padding:10px 12px;">',
                      '<div style="font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:0.3px;">Criticos</div>',
                      f'<div style="font-size:20px;font-weight:700;color:#c0392b;margin-top:2px;">{criticos}</div>',
                      '</td></tr></table></td>',
                      '</tr></table></td></tr>',
                      '<tr><td style="padding:0 24px 16px;">',
                      '<p style="margin:0 0 8px;font-size:11px;font-weight:700;color:#58595B;text-transform:uppercase;letter-spacing:0.3px;">Nuevos Incumplimientos</p>',
                      '<div style="overflow-x:auto;border-radius:6px;border:1px solid #e5e7eb;">',
                      '<table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:9px;">',
                      f'<thead><tr>{encabezados_html}</tr></thead><tbody>{filas_html}</tbody>',
                      '</table></div>',
                      '<p style="margin:6px 0 0;font-size:9px;color:#9ca3af;">',
                      '<span style="display:inline-block;width:8px;height:8px;background:#c0392b;border-radius:1px;margin-right:3px;"></span>',
                      'El archivo Excel completo (solo nuevos registros) se adjunta.</p>',
                      '</td></tr>',
                      '<tr><td style="background:#f9fafb;border-top:1px solid #e5e7eb;padding:12px 24px;">',
                      '<table width="100%" cellpadding="0" cellspacing="0"><tr>',
                      '<td style="font-size:9px;color:#9ca3af;">Correo automático del sistema de monitoreo de INGEURBE. No responder.</td>',
                      '<td align="right" style="font-size:9px;color:#8DC63F;font-weight:700;white-space:nowrap;">INGEURBE</td>',
                      '</tr></table></td></tr>',
                      '</table></td></tr></table></body></html>',
                  ]
                  html_correo = "".join(html_partes)

                  email_payload = {
                      'message': {
                          'subject': f'Reporte de Incumplimientos - {proyecto} - {datetime.now().strftime("%d/%m/%Y")} ({registros_nuevos} nuevos)',
                          'body': {
                              'contentType': 'HTML',
                              'content': html_correo
                          },
                          'toRecipients': [
                              {
                                  'emailAddress': {
                                      'address': email_destino
                                  }
                              }
                          ],
                          'attachments': [
                              {
                                  '@odata.type': '#microsoft.graph.fileAttachment',
                                  'name': f'Incumplimientos_Nuevos_{proyecto}.xlsx',
                                  'contentBytes': archivo_contenido
                              }
                          ]
                      },
                      'saveToSentItems': True
                  }

                  send_url = f'https://graph.microsoft.com/v1.0/users/{mail_from}/sendMail'
                  headers = {
                      'Authorization': f'Bearer {access_token}',
                      'Content-Type': 'application/json'
                  }

                  send_response = requests.post(send_url, json=email_payload, headers=headers)

                  if send_response.status_code in [200, 202]:
                      print(f'  [+] Email enviado exitosamente')
                      print(f'  [+] Destinatario: {email_destino}')
                      print(f'  [+] {len(ids_a_enviar)} registros marcados como enviados')
                      ids_ya_enviados_global.update(ids_a_enviar)
                  else:
                      print(f'  [!] Error al enviar email: {send_response.status_code}')
                      print(f'  [!] Respuesta: {send_response.text}')

                  os.unlink(tmp_path)

              guardar_control_enviados(ids_ya_enviados_global)
              print(f'\n[+] Todos los reportes han sido procesados correctamente')

          except Exception as e:
              print(f'  [!] Error: {str(e)}')
              import traceback
              traceback.print_exc()
              exit(1)

        shell: python

      - name: Guardar control de enviados en repositorio
        run: |
          git config --global user.email "sistema@ingeurbe.com.co"
          git config --global user.name "Sistema INGEURBE"

          if [ -f ".github/data/enviados.csv" ]; then
            git add .github/data/enviados.csv
            if ! git diff --cached --quiet; then
              git commit -m "[AUTO] Actualizar control de registros enviados"
              git push origin main
              echo "[+] ✅ Control de registros guardado en repositorio"
            else
              echo "[*] Sin cambios en el control de registros"
            fi
          else
            echo "[!] No se encontró archivo de control"
          fi
        continue-on-error: true
