name: 📧 Reporte

on:
  workflow_dispatch:

jobs:
  enviar-reportes-por-proyecto:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v3

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Instalar dependencias
        run: |
          pip install requests openpyxl pandas

      - name: 📧 Enviar reportes por proyecto
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          EMAIL_FLORA: ${{ secrets.EMAIL_FLORA }}
          EMAIL_TERRA: ${{ secrets.EMAIL_TERRA }}
          EMAIL_NATIVA: ${{ secrets.EMAIL_NATIVA }}
          EMAIL_VIALE: ${{ secrets.EMAIL_VIALE }}
        run: |
          import requests
          import base64
          import os
          import tempfile
          import pandas as pd
          from datetime import datetime
          from openpyxl import load_workbook

          # Cargar logo corporativo como base64
          logo_path = "Visuales/inge.png"
          logo_b64 = ""
          if os.path.exists(logo_path):
              with open(logo_path, "rb") as f:
                  logo_b64 = base64.b64encode(f.read()).decode()

          # Configuración
          tenant_id = os.getenv('TENANT_ID')
          client_id = os.getenv('CLIENT_ID')
          client_secret = os.getenv('CLIENT_SECRET')
          mail_from = os.getenv('MAIL_FROM')
          archivo_incumplimientos = "desplegable/Incumplimientos.xlsx"

          # Mapeo de proyectos a correos
          proyectos_correos = {
              'FLORA': os.getenv('EMAIL_FLORA'),
              'TERRA': os.getenv('EMAIL_TERRA'),
              'NATIVA': os.getenv('EMAIL_NATIVA'),
              'VIALE': os.getenv('EMAIL_VIALE')
          }

          print(f'\n[*] Iniciando envío de reportes por proyecto...')
          print(f'  [+] Correo remitente: {mail_from}')

          try:
              # Paso 1: Obtener token de acceso
              print(f'\n[*] Obteniendo token de acceso...')
              token_url = f'https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/token'
              token_data = {
                  'grant_type': 'client_credentials',
                  'client_id': client_id,
                  'client_secret': client_secret,
                  'scope': 'https://graph.microsoft.com/.default'
              }

              token_response = requests.post(token_url, data=token_data)
              if token_response.status_code != 200:
                  print(f'  [!] Error al obtener token: {token_response.text}')
                  exit(1)

              access_token = token_response.json()['access_token']
              print(f'  [+] ✅ Token obtenido exitosamente')

              # Paso 2: Leer archivo Incumplimientos.xlsx
              print(f'\n[*] Leyendo archivo Incumplimientos.xlsx...')
              if not os.path.exists(archivo_incumplimientos):
                  print(f'  [!] Error: Archivo no encontrado: {archivo_incumplimientos}')
                  exit(1)

              df_incumplimientos = pd.read_excel(archivo_incumplimientos)
              print(f'  [+] ✅ Archivo leído: {len(df_incumplimientos)} registros')

              # Paso 3: Identificar proyectos únicos
              proyectos_unicos = df_incumplimientos['Proyecto'].unique()
              print(f'  [+] Proyectos encontrados: {list(proyectos_unicos)}')

              fecha_actual = datetime.now().strftime('%d-%m-%Y %H:%M:%S')

              # Paso 4: Enviar email para cada proyecto
              for proyecto in proyectos_unicos:
                  if pd.isna(proyecto):
                      continue

                  email_destino = proyectos_correos.get(proyecto)
                  if not email_destino:
                      print(f'\n[!] Advertencia: No hay correo configurado para proyecto: {proyecto}')
                      continue

                  print(f'\n[*] Procesando proyecto: {proyecto}')

                  # Filtrar datos para este proyecto
                  df_proyecto = df_incumplimientos[df_incumplimientos['Proyecto'] == proyecto].copy()
                  registros_proyecto = len(df_proyecto)
                  print(f'  [+] Registros encontrados: {registros_proyecto}')

                  # Crear archivo temporal filtrado
                  with tempfile.NamedTemporaryFile(suffix='.xlsx', delete=False) as tmp:
                      tmp_path = tmp.name
                      df_proyecto.to_excel(tmp_path, index=False)

                  # Leer archivo temporal y codificarlo
                  with open(tmp_path, 'rb') as f:
                      archivo_contenido = base64.b64encode(f.read()).decode()

                  # Enviar email
                  print(f'  [+] Enviando email a: {email_destino}')

                  # Construir filas de la tabla de incumplimientos
                  columnas_tabla = [
                      'Cilindro N°', 'Código de mezcla', 'Tipo de mezcla', 'Localización',
                      'Edad (días)', 'Resistencia nominal (MPa)', 'Resistencia (MPa)',
                      'Resistencia (%)', 'Toma', 'Rotura', 'Estado'
                  ]
                  cols_disponibles = [c for c in columnas_tabla if c in df_proyecto.columns]
                  df_tabla = df_proyecto[cols_disponibles].copy()

                  filas_html = ""
                  for i, (_, row) in enumerate(df_tabla.iterrows()):
                      bg = "#f9fafb" if i % 2 == 0 else "#ffffff"
                      resistencia_pct = row.get('Resistencia (%)', None)
                      color_res = "#c0392b" if pd.notna(resistencia_pct) and resistencia_pct < 90 else "#58595B"
                      celdas = ""
                      for col in cols_disponibles:
                          val = row[col]
                          if pd.isna(val):
                              val = "-"
                          elif hasattr(val, 'strftime'):
                              val = val.strftime('%d/%m/%Y')
                          elif isinstance(val, float):
                              val = f"{val:.1f}"
                          estilo_celda = f'color:{color_res};font-weight:600;' if col == 'Resistencia (%)' else ''
                          celdas += f'<td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;font-size:12px;color:#374151;{estilo_celda}">{val}</td>'
                      filas_html += f'<tr style="background:{bg};">{celdas}</tr>'

                  encabezados_html = "".join(
                      f'<th style="padding:10px;text-align:left;font-size:11px;font-weight:700;color:#ffffff;background:#58595B;white-space:nowrap;">{col}</th>'
                      for col in cols_disponibles
                  )

                  # Estadísticas resumen
                  res_pct_col = df_proyecto.get('Resistencia (%)', pd.Series(dtype=float))
                  criticos = int((res_pct_col < 85).sum()) if len(res_pct_col) > 0 else 0
                  observacion = int(((res_pct_col >= 85) & (res_pct_col < 95)).sum()) if len(res_pct_col) > 0 else 0
                  res_promedio = f"{res_pct_col.mean():.1f}%" if len(res_pct_col) > 0 else "N/A"

                  logo_tag = f'<img src="data:image/png;base64,{logo_b64}" alt="INGEURBE" style="height:50px;" />' if logo_b64 else '<span style="font-size:22px;font-weight:700;color:#8DC63F;">INGEURBE</span>'

                  html_partes = [
                      '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"></head>',
                      '<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,sans-serif;">',
                      '<table width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:30px 0;"><tr><td align="center">',
                      '<table width="720" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);max-width:720px;">',
                      '<tr><td style="background:linear-gradient(135deg,#58595B 0%,#3a3b3d 100%);padding:28px 36px;">',
                      '<table width="100%" cellpadding="0" cellspacing="0"><tr>',
                      f'<td>{logo_tag}</td>',
                      f'<td align="right" style="color:#ffffff;font-size:12px;opacity:0.8;">{fecha_actual}</td>',
                      '</tr></table></td></tr>',
                      '<tr><td style="background:#8DC63F;height:5px;"></td></tr>',
                      '<tr><td style="padding:28px 36px 16px;">',
                      '<h1 style="margin:0;font-size:22px;color:#58595B;font-weight:700;">Reporte de Incumplimientos</h1>',
                      f'<p style="margin:6px 0 0;font-size:15px;color:#6b7280;">Proyecto: <strong style="color:#8DC63F;">{proyecto}</strong></p>',
                      '</td></tr>',
                      '<tr><td style="padding:0 36px 24px;"><table width="100%" cellpadding="0" cellspacing="0"><tr>',
                      '<td width="32%" style="padding:0 6px 0 0;"><table width="100%" cellpadding="0" cellspacing="0" style="background:#f9fafb;border-radius:8px;border-left:4px solid #8DC63F;"><tr><td style="padding:14px 16px;">',
                      '<div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:0.5px;">Total Incumplimientos</div>',
                      f'<div style="font-size:26px;font-weight:700;color:#58595B;margin-top:4px;">{registros_proyecto}</div>',
                      '</td></tr></table></td>',
                      '<td width="32%" style="padding:0 6px;"><table width="100%" cellpadding="0" cellspacing="0" style="background:#f9fafb;border-radius:8px;border-left:4px solid #e67e22;"><tr><td style="padding:14px 16px;">',
                      '<div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:0.5px;">En Observaci&#243;n</div>',
                      f'<div style="font-size:26px;font-weight:700;color:#e67e22;margin-top:4px;">{observacion}</div>',
                      '</td></tr></table></td>',
                      '<td width="32%" style="padding:0 0 0 6px;"><table width="100%" cellpadding="0" cellspacing="0" style="background:#f9fafb;border-radius:8px;border-left:4px solid #c0392b;"><tr><td style="padding:14px 16px;">',
                      '<div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:0.5px;">Cr&#237;ticos (&lt;85%)</div>',
                      f'<div style="font-size:26px;font-weight:700;color:#c0392b;margin-top:4px;">{criticos}</div>',
                      '</td></tr></table></td>',
                      '</tr></table></td></tr>',
                      '<tr><td style="padding:0 36px 28px;">',
                      '<p style="margin:0 0 12px;font-size:13px;font-weight:700;color:#58595B;text-transform:uppercase;letter-spacing:0.5px;">Detalle de Incumplimientos</p>',
                      '<div style="overflow-x:auto;border-radius:8px;border:1px solid #e5e7eb;">',
                      '<table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;min-width:600px;">',
                      f'<thead><tr>{encabezados_html}</tr></thead><tbody>{filas_html}</tbody>',
                      '</table></div>',
                      '<p style="margin:10px 0 0;font-size:11px;color:#9ca3af;">',
                      '<span style="display:inline-block;width:10px;height:10px;background:#c0392b;border-radius:2px;margin-right:4px;"></span>',
                      'Resistencia &lt; 90% | El archivo Excel completo se adjunta a este correo.</p>',
                      '</td></tr>',
                      '<tr><td style="background:#f9fafb;border-top:1px solid #e5e7eb;padding:20px 36px;">',
                      '<table width="100%" cellpadding="0" cellspacing="0"><tr>',
                      '<td style="font-size:11px;color:#9ca3af;">Este es un correo autom&#225;tico generado por el sistema de monitoreo de resistencia de concretos de INGEURBE.<br>Por favor no responda este correo.</td>',
                      '<td align="right" style="font-size:11px;color:#8DC63F;font-weight:700;white-space:nowrap;">INGEURBE &middot; Inspiraci&#243;n que construye</td>',
                      '</tr></table></td></tr>',
                      '</table></td></tr></table></body></html>',
                  ]
                  html_correo = "".join(html_partes)

                  email_payload = {
                      'message': {
                          'subject': f'⚠️ Incumplimientos de Resistencia · {proyecto} · {datetime.now().strftime("%d/%m/%Y")}',
                          'body': {
                              'contentType': 'HTML',
                              'content': html_correo
                          },
                          'toRecipients': [
                              {
                                  'emailAddress': {
                                      'address': email_destino
                                  }
                              }
                          ],
                          'attachments': [
                              {
                                  '@odata.type': '#microsoft.graph.fileAttachment',
                                  'name': f'Incumplimientos_{proyecto}.xlsx',
                                  'contentBytes': archivo_contenido
                              }
                          ]
                      },
                      'saveToSentItems': True
                  }

                  send_url = f'https://graph.microsoft.com/v1.0/users/{mail_from}/sendMail'
                  headers = {
                      'Authorization': f'Bearer {access_token}',
                      'Content-Type': 'application/json'
                  }

                  send_response = requests.post(send_url, json=email_payload, headers=headers)

                  if send_response.status_code in [200, 202]:
                      print(f'  [+] ✅ Email enviado exitosamente')
                      print(f'  [+] Destinatario: {email_destino}')
                  else:
                      print(f'  [!] Error al enviar email: {send_response.status_code}')
                      print(f'  [!] Respuesta: {send_response.text}')

                  # Limpiar archivo temporal
                  os.unlink(tmp_path)

              print(f'\n[+] ✅ Todos los reportes han sido enviados correctamente')

          except Exception as e:
              print(f'  [!] Error: {str(e)}')
              import traceback
              traceback.print_exc()
              exit(1)

        shell: python
